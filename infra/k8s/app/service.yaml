apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: text-analysis
  namespace: serverless-lab
  labels:
    app.kubernetes.io/part-of: python-serverless-lab
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/class: kpa.autoscaling.knative.dev
        autoscaling.knative.dev/metric: concurrency
        autoscaling.knative.dev/min-scale: "0"
        autoscaling.knative.dev/max-scale: "3"
        autoscaling.knative.dev/target: "5"
        autoscaling.knative.dev/target-utilization-percentage: "100"
    spec:
      automountServiceAccountToken: false
      containerConcurrency: 10
      timeoutSeconds: 30
      containers:
        - name: app
          # deploy replaces this sentinel with a tag derived from the local image ID.
          image: dev.local/serverless-lab:replace-at-deploy
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 2
            timeoutSeconds: 1
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: temporary
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
