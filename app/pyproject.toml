[project]
name = "serverless-lab"
version = "0.1.0"
description = "A local educational text-analysis service for serverless containers"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi==0.162.0",
    "pydantic==2.14.1",
    "starlette==1.10.0",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["uv_build==0.13.5"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2==2.16.0",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "ruff==0.17.2",
    "uv-build==0.13.5",
]

[tool.uv]
required-version = "==0.13.5"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-ra"]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.14"
plugins = ["pydantic.mypy"]
strict = true
disallow_any_explicit = true
disallow_any_unimported = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["serverless_lab.domain.*", "serverless_lab.application.*"]
disallow_any_expr = true

[tool.pydantic-mypy]
init_typed = true
init_forbid_extra = true
warn_required_dynamic_aliases = true
